<!-- 防白屏守卫：英文课程数据引用失效时给出明确提示 + 一键重试 -->
<script>
(function () {
  function show(msg) {
    if (document.getElementById('failsafeBox')) return;
    var box = document.createElement('div');
    box.id = 'failsafeBox';
    box.style.cssText = 'position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:99999;max-width:min(680px,92vw);background:#fff7ed;border:2px solid #f97316;border-radius:14px;padding:16px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25);color:#7c2d12;font:14px/1.7 -apple-system,system-ui,sans-serif';
    box.innerHTML = '<b style="font-size:15px">⚠️ 英文课程数据没加载出来</b><br>' + msg +
      '<div style="margin-top:6px;color:#9a3412">这不是你的操作问题，是课程数据文件的引用失效了。</div>' +
      '<button id="failsafeRetry" style="margin-top:10px;padding:7px 16px;border:0;border-radius:8px;background:#ea580c;color:#fff;font-weight:600;cursor:pointer">清缓存重试</button>';
    document.body.appendChild(box);
    document.getElementById('failsafeRetry').onclick = function () {
      location.href = location.pathname + '?fresh=' + Date.now() + location.hash;
    };
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      show('脚本加载失败：<code>' + (e.target.src || '').split('/').pop() + '</code>');
    }
  }, true);
  setTimeout(function () {
    var app = document.getElementById('app');
    if (app && !app.innerHTML.trim()) show('页面内容为空，英文课程数据可能没读到。');
    if (!window.EN_COURSES || Object.keys(window.EN_COURSES).length < 2) show('英文课程数据是空的。');
  }, 1500);
})();
</script>

<script src="data/english-courses.js?v=1"></script>

<script src="assets/english.js?v=1"></script>
