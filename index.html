<script>
(function () {
  if (!window.PY) return;
  /* 卡片底部细绿线 = 该模块已听进度（不显示文字，保持首页干净） */
  var cards = document.querySelectorAll('.module-card[data-id]');
  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute('data-id');
    var t, d;
    if (id === 'ai' && window.AI_GROUPS) {
      t = 0; d = 0;
      for (var g in window.AI_GROUPS) {
        window.AI_GROUPS[g].forEach(function (cid) { t += window.PY.totalOf(cid); d += window.PY.countDone(cid); });
      }
    } else {
      t = window.PY.totalOf(id); d = window.PY.countDone(id);
    }
    var bar = cards[i].querySelector('.mprog i');
    if (bar && t) bar.style.width = Math.round(d / t * 100) + '%';
  }

  /* 底部一行：学习顺序 + 重复提醒 */
  var S = window.PY_STEPS || {};
  var f = document.getElementById('orderFoot');
  if (f && S.intro) {
    var names = { intro: '入门', git: 'Git 工具', ai: 'AI 实战', adv: '进阶', project: '项目实战' };
    var parts = [];
    ['intro', 'git', 'ai', 'adv', 'project'].forEach(function (k) {
      if (S[k]) parts.push('<b>' + names[k] + '</b> ' + S[k].days + ' 天');
    });
    f.innerHTML = '按这个顺序学：' + parts.join(' → ') +
      '（每天 2 小时，约 4 个月）　·　入门第 13~18 章与进阶／实战重复，课表里已标「可跳过」' +
      '<br>Git 与四门 Python 课零重复；JavaWeb 是 Java 方向、与 Python 路线零重复，只学 Python 可跳过。';
  }
})();
</script>
